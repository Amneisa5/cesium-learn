        }

            border: 1px solid #ddd;

        function formatTime (timestamp, format = 'yyyy-MM-dd') {
            // 处理字符串格式的时间戳（如 "1611264443000"）
            const timestampNum = typeof timestamp === 'string' ? parseInt(timestamp) : timestamp;
            const date = new Date(timestampNum);

            // 检查日期是否有效
            if (isNaN(date.getTime())) {
                console.error('无效的时间戳:', timestamp);
                return '无效日期';
            }

            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');

            if (format === 'yyyy-MM-dd') {
                return `${year}-${month}-${day}`;
            } else {
                return `${year}-${month}-${day}`;
            }
        }

        function generateDemoData () {
            renderChart(demoData);

        // 渲染3D曲面图
        function renderChart (data) {
            if (!data || !data.x || !data.y || !data.z) {
                showError('数据格式不正确，缺少必要的字段');
                return;
            }

            // 根据实际数据结构调整：x是时间，y是深度
            // 处理时间数据：后台现在直接返回时间戳数组
            const timeDataNumeric = data.x[0].map(timestamp => {
                // 处理时间戳（可能是字符串或数字）
                return typeof timestamp === 'string' ? parseInt(timestamp) : timestamp;
            });

            // 转换时间戳为可读格式，并智能选择显示格式
            const timeLabels = data.x[0].map(timestamp => {
                const timestampNum = typeof timestamp === 'string' ? parseInt(timestamp) : timestamp;
                const date = new Date(timestampNum);
                // 如果时间点太多，只显示月份和日期，避免拥挤
                if (data.x[0].length > 10) {
                    return `${date.getMonth() + 1}/${date.getDate()}`; // 格式：月/日
                } else {
                    return date.toISOString().split('T')[0]; // 完整日期
                }
            });

            // 获取观测类型对应的单位（从URL参数获取）
            const observationType = document.getElementById('observationType').value;
            const units = {
                temperature: '°C',
                salinity: 'PSU',
                pressure: 'dbar'
            };

            const valueUnit = data.zUnit || units[observationType] || '';

            // 创建3D曲面图 - 根据实际数据结构调整轴
            const trace = {
                type: 'surface',
                x: data.y[0],        // X轴：深度（从y字段获取）
                y: timeDataNumeric,  // Y轴：时间（从x字段获取）
                z: data.z,           // Z轴：观测值
                colorscale: 'thermal',
                colorbar: {
                    title: `${getObservationTypeName(observationType)} (${valueUnit})`,
                    titleside: 'right'
                },
                hovertemplate:
                    '深度: %{x}' + (data.yUnit || 'm') + '<br>' +
                    '时间: %{customdata}<br>' +
                    `${getObservationTypeName(observationType)}: %{z}${valueUnit}<br>` +
                    '<extra></extra>',
                customdata: timeLabels
            };

            const layout = {
                title: `Argo ${getObservationTypeName(observationType)} 三维曲面图`,
                scene: {
                    xaxis: {
                        title: `深度 (${data.yUnit || 'm'})`,
                        autorange: 'reversed'  // 深度越大，数值越小，通常需要反转
                    },
                    yaxis: {
                        title: '时间',
                        tickvals: timeDataNumeric,
                        ticktext: timeLabels,
                        type: 'date',
                        // 优化时间轴显示：如果时间点太多，减少刻度数量
                        nticks: data.x[0].length > 10 ? Math.min(10, data.x[0].length) : data.x[0].length,
                        // 设置时间格式
                        tickformat: data.x[0].length > 10 ? '%m/%d' : '%Y-%m-%d'
                    },
                    zaxis: {
                        title: `${getObservationTypeName(observationType)} (${valueUnit})`
                    },
                    camera: {
                        eye: { x: 1.5, y: 1.5, z: 1.5 }
                    }
                },
                margin: { l: 0, r: 0, b: 0, t: 50 }
            };

            const config = {
                responsive: true,
                displayModeBar: true,
                displaylogo: false
            };

            Plotly.newPlot('chart', [trace], layout, config);
        }

        // 获取观测类型的中文名称
        function getObservationTypeName (type) {
            const names = {
                temperature: '温度',
                salinity: '盐度',
                pressure: '压力'
            };
            return names[type] || type;
        }

        // 显示数据信息
        function showInfo (data) {
            const infoPanel = document.getElementById('infoPanel');
            const dataInfo = document.getElementById('dataInfo');

            const observationType = document.getElementById('observationType').value;

            // 计算时间范围（从x轴数据中获取）
            const timeStrings = data.x && data.x[0] ? data.x[0] : [];
            const startTime = timeStrings.length > 0 ? timeStrings[0] : '未知';
            const endTime = timeStrings.length > 0 ? timeStrings[timeStrings.length - 1] : '未知';

            // 计算深度范围（从y轴数据中获取）
            const depthData = data.y && data.y[0] ? data.y[0] : [];
            const depthMin = depthData.length > 0 ? Math.min(...depthData) : '未知';
            const depthMax = depthData.length > 0 ? Math.max(...depthData) : '未知';

            // 计算值范围
            let valueMin = '未知';
            let valueMax = '未知';
            if (data.z && data.z.length > 0) {
                const allValues = data.z.flat();
                if (allValues.length > 0) {
                    valueMin = Math.min(...allValues);
                    valueMax = Math.max(...allValues);
                }
            }

            dataInfo.innerHTML = `
                <p><strong>观测类型:</strong> ${getObservationTypeName(observationType)}</p>
                <p><strong>时间范围:</strong> ${startTime} - ${endTime}</p>
                <p><strong>深度范围:</strong> ${depthMin} - ${depthMax} ${data.yUnit || 'm'}</p>
                <p><strong>值范围:</strong> ${valueMin} - ${valueMax} ${data.zUnit || ''}</p>
                <p><strong>时间点数量:</strong> ${timeStrings.length}</p>
                <p><strong>深度点数量:</strong> ${depthData.length}</p>
                <p><strong>数据矩阵:</strong> ${data.z.length} × ${data.z[0]?.length || 0}</p>
                <p><strong>数据点总数:</strong> ${data.z.length * (data.z[0]?.length || 0)}</p>
            `;

            infoPanel.style.display = 'block';
        }

        // 显示加载状态
        function showLoading () {
            const chart = document.getElementById('chart');
            chart.innerHTML = '<div class="loading">正在获取数据...</div>';
        }

        // 显示错误信息
        function showError (message) {
            const errorPanel = document.getElementById('errorPanel');
            errorPanel.innerHTML = message;
            errorPanel.style.display = 'block';
        }

        // 隐藏错误信息
        function hideError () {
            const errorPanel = document.getElementById('errorPanel');
            errorPanel.style.display = 'none';
        }

        // 重置图表
        function resetChart () {
            const chart = document.getElementById('chart');
            chart.innerHTML = '';

            const infoPanel = document.getElementById('infoPanel');
            infoPanel.style.display = 'none';

            hideError();
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function () {
            // 设置默认日期为最近一周
            const today = new Date();
            const oneWeekAgo = new Date(today);
            oneWeekAgo.setDate(today.getDate() - 7);

            document.getElementById('endTime').value = today.toISOString().split('T')[0];
            document.getElementById('startTime').value = oneWeekAgo.toISOString().split('T')[0];

            console.log('页面初始化完成，可以开始测试');
        });
    </script>
</body>

</html>
